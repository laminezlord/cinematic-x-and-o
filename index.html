<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>X & O — The Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;800&family=Inter:wght@300;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --x: #ff3b5c;
    --x-glow: rgba(255, 59, 92, 0.7);
    --o: #29d3ff;
    --o-glow: rgba(41, 211, 255, 0.7);
    --gold: #f5c86a;
    --bg: #05060a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #e9e6df;
    font-family: "Inter", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  canvas#fx { position: fixed; inset: 0; z-index: 0; }

  /* film grain + vignette */
  .grain, .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.85) 100%); }
  .grain {
    opacity: 0.07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 0.6s steps(4) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0); } 25% { transform: translate(-3%,2%); }
    50% { transform: translate(2%,-3%); } 75% { transform: translate(-2%,-1%); } 100% { transform: translate(0,0); }
  }

  /* letterbox bars */
  .bar { position: fixed; left: 0; right: 0; height: 12vh; background: #000; z-index: 40; transition: height 1.2s cubic-bezier(.7,0,.2,1); }
  .bar.top { top: 0; } .bar.bottom { bottom: 0; }
  body.playing .bar { height: 5vh; }
  body.climax .bar { height: 16vh; }

  #stage {
    position: relative; z-index: 10; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.2vh;
  }
  #stage.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px); } 20%, 80% { transform: translate(4px, -2px); }
    30%, 50%, 70% { transform: translate(-8px, 3px) rotate(-0.4deg); } 40%, 60% { transform: translate(8px, -3px) rotate(0.4deg); }
  }

  /* intro */
  #intro {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
    transition: opacity 1s ease, transform 1.2s ease;
  }
  #intro.gone { opacity: 0; transform: scale(1.15); pointer-events: none; }
  .presents { letter-spacing: 0.8em; font-size: 0.75rem; text-transform: uppercase; color: #8a8578; opacity: 0; animation: fadeUp 1.6s 0.4s forwards; }
  .title {
    font-family: "Cinzel", serif; font-weight: 800;
    font-size: clamp(3rem, 11vw, 9rem); letter-spacing: 0.08em; line-height: 1;
    background: linear-gradient(180deg, #fff 0%, #d9c9a0 45%, #8b6d2e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 30px rgba(245,200,106,0.25));
    opacity: 0; animation: titleIn 2.2s 1s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .title .x { background: linear-gradient(180deg,#fff,var(--x)); -webkit-background-clip: text; background-clip: text; }
  .title .o { background: linear-gradient(180deg,#fff,var(--o)); -webkit-background-clip: text; background-clip: text; }
  .subtitle { font-family: "Cinzel", serif; letter-spacing: 0.6em; font-size: clamp(0.8rem, 1.6vw, 1.1rem); color: var(--gold); opacity: 0; animation: fadeUp 1.4s 2.4s forwards; }
  @keyframes titleIn { 0% { opacity: 0; letter-spacing: 0.6em; filter: blur(14px); } 100% { opacity: 1; letter-spacing: 0.08em; filter: blur(0) drop-shadow(0 0 30px rgba(245,200,106,0.25)); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .menu { display: flex; flex-direction: column; gap: 1.4vh; align-items: center; opacity: 0; animation: fadeUp 1.2s 3.2s forwards; margin-top: 2vh; }
  .menu .row { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; }
  button.btn {
    font-family: "Cinzel", serif; font-size: 0.95rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: #e9e6df; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(245,200,106,0.35); padding: 0.9rem 1.8rem; cursor: pointer;
    position: relative; overflow: hidden; transition: all 0.35s ease;
  }
  button.btn::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(245,200,106,0.25), transparent);
    transform: translateX(-100%); transition: transform 0.6s ease;
  }
  button.btn:hover { border-color: var(--gold); color: #fff; box-shadow: 0 0 24px rgba(245,200,106,0.25); }
  button.btn:hover::before { transform: translateX(100%); }
  button.btn.small { font-size: 0.7rem; padding: 0.55rem 1rem; letter-spacing: 0.2em; }
  button.btn.active { border-color: var(--gold); background: rgba(245,200,106,0.12); color: #fff; }
  .hint { font-size: 0.72rem; color: #6d695f; letter-spacing: 0.2em; text-transform: uppercase; }

  /* HUD */
  #hud { display: flex; align-items: center; gap: clamp(1rem, 5vw, 4rem); opacity: 0; transition: opacity 1s 0.4s; }
  body.playing #hud, body.climax #hud { opacity: 1; }
  .player { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; opacity: 0.4; transition: all 0.5s ease; min-width: 110px; }
  .player.turn { opacity: 1; transform: scale(1.08); }
  .player .sym { font-family: "Cinzel", serif; font-size: 2rem; font-weight: 800; }
  .player.px .sym { color: var(--x); text-shadow: 0 0 20px var(--x-glow); }
  .player.po .sym { color: var(--o); text-shadow: 0 0 20px var(--o-glow); }
  .player .name { font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; color: #9c978a; }
  .player .score { font-family: "Cinzel", serif; font-size: 1.6rem; }
  .vs { font-family: "Cinzel", serif; color: var(--gold); letter-spacing: 0.3em; font-size: 0.8rem; text-align: center; }
  .vs .draws { display: block; margin-top: 0.4rem; color: #6d695f; font-size: 0.65rem; }

  /* board */
  #boardWrap { position: relative; width: min(72vmin, 520px); aspect-ratio: 1; opacity: 0; transform: perspective(1200px) rotateX(35deg) scale(0.85); transition: all 1.4s cubic-bezier(.2,.8,.2,1); }
  body.playing #boardWrap, body.climax #boardWrap { opacity: 1; transform: perspective(1200px) rotateX(0) scale(1); }
  #board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); }
  .cell { position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cell::after { content: ""; position: absolute; inset: 14%; border-radius: 6px; background: radial-gradient(circle, rgba(245,200,106,0.12), transparent 70%); opacity: 0; transition: opacity 0.3s; }
  .cell:hover::after { opacity: 1; }
  .cell.taken { cursor: default; } .cell.taken::after { display: none; }
  .cell svg { width: 70%; height: 70%; overflow: visible; }
  .cell .ghost { position: absolute; opacity: 0; transition: opacity 0.25s; }
  .cell:not(.taken):hover .ghost { opacity: 0.18; }

  svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  svg.grid line { stroke: url(#gridGrad); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 520; stroke-dashoffset: 520; filter: drop-shadow(0 0 6px rgba(245,200,106,0.5)); }
  body.playing svg.grid line, body.climax svg.grid line { animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
  svg.grid line:nth-child(2) { animation-delay: 0.15s !important; }
  svg.grid line:nth-child(3) { animation-delay: 0.3s !important; }
  svg.grid line:nth-child(4) { animation-delay: 0.45s !important; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .mark-x path { stroke: var(--x); stroke-width: 9; stroke-linecap: round; fill: none; filter: drop-shadow(0 0 10px var(--x-glow)) drop-shadow(0 0 22px var(--x-glow)); stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 0.28s cubic-bezier(.7,0,.3,1) forwards; }
  .mark-x path:nth-child(2) { animation-delay: 0.18s; }
  .mark-o circle { stroke: var(--o); stroke-width: 9; fill: none; filter: drop-shadow(0 0 10px var(--o-glow)) drop-shadow(0 0 22px var(--o-glow)); stroke-dasharray: 260; stroke-dashoffset: 260; transform: rotate(-90deg); transform-origin: center; animation: draw 0.5s cubic-bezier(.7,0,.3,1) forwards; }
  .cell.winner svg { animation: pulse 1.1s ease-in-out infinite; }
  .cell.dim svg { opacity: 0.18; transition: opacity 1.2s; }
  @keyframes pulse { 50% { transform: scale(1.12); filter: brightness(1.6); } }

  svg#slash { position: absolute; inset: -6%; width: 112%; height: 112%; pointer-events: none; overflow: visible; }
  svg#slash line { stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; }
  svg#slash line.go { animation: slash 0.45s cubic-bezier(.9,0,.1,1) forwards; }
  @keyframes slash { to { stroke-dashoffset: 0; } }

  #status { font-family: "Cinzel", serif; letter-spacing: 0.35em; text-transform: uppercase; font-size: 0.85rem; color: #b7b1a2; height: 1.2em; opacity: 0; transition: opacity 0.8s 0.8s; }
  body.playing #status { opacity: 1; }
  #controls { display: flex; gap: 0.6rem; opacity: 0; transition: opacity 0.8s 1s; }
  body.playing #controls { opacity: 1; }

  /* flash + finale */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 45; }
  #flash.go { animation: flash 0.7s ease-out; }
  @keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }

  #finale { position: fixed; inset: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5vh; pointer-events: none; opacity: 0; transition: opacity 0.9s ease; background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), rgba(0,0,0,0.8)); }
  #finale.show { opacity: 1; pointer-events: auto; }
  #finale .big { font-family: "Cinzel", serif; font-weight: 800; font-size: clamp(2.6rem, 9vw, 7rem); letter-spacing: 0.12em; transform: scale(1.4); filter: blur(10px); opacity: 0; transition: all 1.1s cubic-bezier(.2,.8,.2,1) 0.2s; text-align: center; }
  #finale.show .big { transform: scale(1); filter: blur(0); opacity: 1; }
  #finale .tag { letter-spacing: 0.6em; text-transform: uppercase; font-size: 0.8rem; color: var(--gold); opacity: 0; transition: opacity 1s 0.9s; }
  #finale.show .tag { opacity: 1; }
  #finale .btn { opacity: 0; transition: opacity 1s 1.4s, border-color .35s, box-shadow .35s; }
  #finale.show .btn { opacity: 1; }

  #mute { position: fixed; right: 1.2rem; bottom: calc(5vh + 1rem); z-index: 60; background: none; border: none; color: #6d695f; font-size: 0.7rem; letter-spacing: 0.25em; cursor: pointer; text-transform: uppercase; }
  #mute:hover { color: var(--gold); }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="bar top"></div>
<div class="bar bottom"></div>
<div id="flash"></div>

<section id="intro">
  <div class="presents">A Duel In Three Rows</div>
  <h1 class="title"><span class="x">X</span> &amp; <span class="o">O</span></h1>
  <div class="subtitle">The Duel</div>
  <div class="menu">
    <div class="row">
      <button class="btn" data-mode="ai">Face the Machine</button>
      <button class="btn" data-mode="pvp">Two Players</button>
    </div>
    <div class="row" id="diffRow">
      <button class="btn small" data-diff="easy">Easy</button>
      <button class="btn small active" data-diff="hard">Hard</button>
      <button class="btn small" data-diff="impossible">Impossible</button>
    </div>
    <div class="hint">Machine difficulty</div>
  </div>
</section>

<main id="stage">
  <div id="hud">
    <div class="player px turn"><div class="sym">X</div><div class="name" id="nameX">Player One</div><div class="score" id="scoreX">0</div></div>
    <div class="vs">VS<span class="draws">Draws <b id="scoreD">0</b></span></div>
    <div class="player po"><div class="sym">O</div><div class="name" id="nameO">The Machine</div><div class="score" id="scoreO">0</div></div>
  </div>

  <div id="boardWrap">
    <svg class="grid" viewBox="0 0 300 300">
      <defs>
        <linearGradient id="gridGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f5c86a" stop-opacity="0.15"/>
          <stop offset="50%" stop-color="#f5c86a" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#f5c86a" stop-opacity="0.15"/>
        </linearGradient>
      </defs>
      <line x1="100" y1="6" x2="100" y2="294"/>
      <line x1="200" y1="6" x2="200" y2="294"/>
      <line x1="6" y1="100" x2="294" y2="100"/>
      <line x1="6" y1="200" x2="294" y2="200"/>
    </svg>
    <div id="board"></div>
    <svg id="slash" viewBox="-18 -18 336 336"><line id="slashLine" x1="0" y1="0" x2="0" y2="0"/></svg>
  </div>

  <div id="status">X to move</div>
  <div id="controls">
    <button class="btn small" id="restart">Restart Round</button>
    <button class="btn small" id="menuBtn">Main Menu</button>
  </div>
</main>

<section id="finale">
  <div class="tag" id="finaleTag">Victory</div>
  <div class="big" id="finaleText">X WINS</div>
  <button class="btn" id="again">Next Round</button>
</section>

<button id="mute">Sound: On</button>

<script>
(() => {
  // ---------- Audio (synthesized, no assets) ----------
  let actx = null, muted = false, droneNodes = null;
  const ac = () => (actx ??= new (window.AudioContext || window.webkitAudioContext)());
  function tone({ freq = 440, type = "sine", dur = 0.3, vol = 0.2, slide = 0, delay = 0 }) {
    if (muted) return;
    const c = ac(), t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur = 0.4, vol = 0.25, delay = 0) {
    if (muted) return;
    const c = ac(), len = c.sampleRate * dur, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 1200;
    s.buffer = buf; g.gain.value = vol; s.connect(f).connect(g).connect(c.destination); s.start(c.currentTime + delay);
  }
  const sfx = {
    x: () => { tone({ freq: 220, type: "sawtooth", dur: 0.18, vol: 0.08, slide: -120 }); noise(0.15, 0.12); },
    o: () => { tone({ freq: 520, type: "sine", dur: 0.45, vol: 0.14, slide: 200 }); },
    boom: () => { tone({ freq: 90, type: "sine", dur: 1.6, vol: 0.5, slide: -60 }); noise(1.2, 0.35);
      [261.6, 329.6, 392, 523.3].forEach((f, i) => tone({ freq: f, type: "triangle", dur: 1.8, vol: 0.07, delay: 0.25 + i * 0.09 })); },
    draw: () => { [196, 233, 277].forEach((f, i) => tone({ freq: f, type: "triangle", dur: 1.4, vol: 0.07, delay: i * 0.15 })); },
    whoosh: () => { noise(0.9, 0.15); tone({ freq: 60, type: "sine", dur: 1.2, vol: 0.3, slide: 40 }); },
  };
  function startDrone() {
    if (muted || droneNodes) return;
    const c = ac(), g = c.createGain(); g.gain.value = 0; g.connect(c.destination);
    g.gain.linearRampToValueAtTime(0.035, c.currentTime + 3);
    const os = [55, 82.4, 110.3].map(f => { const o = c.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
      const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 400; o.connect(lp).connect(g); o.start(); return o; });
    droneNodes = { g, os };
  }
  function stopDrone() { if (!droneNodes) return; const c = ac(); droneNodes.g.gain.linearRampToValueAtTime(0, c.currentTime + 0.5); const n = droneNodes; droneNodes = null; setTimeout(() => n.os.forEach(o => o.stop()), 600); }
  document.getElementById("mute").onclick = (e) => { muted = !muted; e.target.textContent = "Sound: " + (muted ? "Off" : "On"); muted ? stopDrone() : (document.body.classList.contains("playing") && startDrone()); };

  // ---------- Background particles ----------
  const cv = document.getElementById("fx"), cx = cv.getContext("2d");
  let W, H, parts = [], sparks = [], timeScale = 1;
  const resize = () => { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; };
  addEventListener("resize", resize); resize();
  for (let i = 0; i < 140; i++) parts.push({ x: Math.random(), y: Math.random(), z: Math.random(), vx: (Math.random() - 0.5) * 0.0003, vy: -Math.random() * 0.0004 - 0.0001 });
  function burst(px, py, color, n = 90) {
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = Math.random() * 9 + 2;
      sparks.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color, size: Math.random() * 3 + 1 }); }
  }
  function loop() {
    cx.fillStyle = "rgba(5,6,10,0.35)"; cx.fillRect(0, 0, W, H);
    const g = cx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.6);
    g.addColorStop(0, "rgba(40,30,15,0.06)"); g.addColorStop(1, "rgba(0,0,0,0)"); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx * timeScale; p.y += p.vy * timeScale;
      if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      const r = (p.z * 1.8 + 0.4) * devicePixelRatio;
      cx.fillStyle = `rgba(245,200,106,${0.15 + p.z * 0.45})`;
      cx.beginPath(); cx.arc(p.x * W, p.y * H, r, 0, 7); cx.fill();
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i]; s.x += s.vx * timeScale * devicePixelRatio; s.y += s.vy * timeScale * devicePixelRatio;
      s.vx *= 0.97; s.vy = s.vy * 0.97 + 0.08 * timeScale; s.life -= 0.012 * timeScale;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      cx.globalAlpha = s.life; cx.fillStyle = s.color; cx.shadowColor = s.color; cx.shadowBlur = 12;
      cx.beginPath(); cx.arc(s.x, s.y, s.size * devicePixelRatio, 0, 7); cx.fill();
      cx.shadowBlur = 0; cx.globalAlpha = 1;
    }
    requestAnimationFrame(loop);
  }
  loop();

  // ---------- Game ----------
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl = document.getElementById("board"), statusEl = document.getElementById("status");
  const svgX = `<svg class="mark-x" viewBox="0 0 100 100"><path d="M18 18 L82 82"/><path d="M82 18 L18 82"/></svg>`;
  const svgO = `<svg class="mark-o" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34"/></svg>`;
  const ghostX = `<svg class="ghost" viewBox="0 0 100 100"><path d="M18 18 L82 82 M82 18 L18 82" stroke="#ff3b5c" stroke-width="8" stroke-linecap="round" fill="none"/></svg>`;
  const ghostO = `<svg class="ghost" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" stroke="#29d3ff" stroke-width="8" fill="none"/></svg>`;

  let board, turn, over, mode = "ai", diff = "hard", locked = false, starter = "X";
  const score = { X: 0, O: 0, D: 0 };

  function winnerOf(b) {
    for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { p: b[l[0]], line: l };
    return b.every(Boolean) ? { p: "D" } : null;
  }
  function minimax(b, me, depth = 0) {
    const w = winnerOf(b);
    if (w) return { s: w.p === "O" ? 10 - depth : w.p === "X" ? depth - 10 : 0 };
    let best = { s: me === "O" ? -Infinity : Infinity, i: -1 };
    for (let i = 0; i < 9; i++) if (!b[i]) {
      b[i] = me; const r = minimax(b, me === "O" ? "X" : "O", depth + 1); b[i] = null;
      if (me === "O" ? r.s > best.s : r.s < best.s) best = { s: r.s, i };
    }
    return best;
  }
  function aiMove() {
    const empty = board.map((v, i) => v ? null : i).filter(v => v !== null);
    const rnd = () => empty[Math.floor(Math.random() * empty.length)];
    if (diff === "easy") return Math.random() < 0.25 ? minimax(board.slice(), "O").i : rnd();
    if (diff === "hard") return Math.random() < 0.8 ? minimax(board.slice(), "O").i : rnd();
    return minimax(board.slice(), "O").i;
  }

  function render() {
    boardEl.innerHTML = "";
    board.forEach((v, i) => {
      const c = document.createElement("div"); c.className = "cell" + (v ? " taken" : ""); c.dataset.i = i;
      c.innerHTML = v ? (v === "X" ? svgX : svgO) : (turn === "X" ? ghostX : ghostO);
      c.onclick = () => play(i, true);
      boardEl.appendChild(c);
    });
  }
  function setTurnUI() {
    document.querySelector(".px").classList.toggle("turn", turn === "X");
    document.querySelector(".po").classList.toggle("turn", turn === "O");
    statusEl.textContent = mode === "ai" && turn === "O" ? "The Machine is thinking…" : `${turn} to move`;
    boardEl.querySelectorAll(".cell:not(.taken)").forEach(c => c.innerHTML = turn === "X" ? ghostX : ghostO);
  }
  function placeMark(i) {
    board[i] = turn;
    const cell = boardEl.children[i]; cell.classList.add("taken"); cell.innerHTML = turn === "X" ? svgX : svgO;
    turn === "X" ? sfx.x() : sfx.o();
    const r = cell.getBoundingClientRect();
    burst((r.left + r.width / 2) * devicePixelRatio, (r.top + r.height / 2) * devicePixelRatio, turn === "X" ? "#ff3b5c" : "#29d3ff", 18);
  }
  function play(i, human) {
    if (over || locked || board[i]) return;
    if (human && mode === "ai" && turn === "O") return;
    placeMark(i);
    const w = winnerOf(board);
    if (w) return finish(w);
    turn = turn === "X" ? "O" : "X"; setTurnUI();
    if (mode === "ai" && turn === "O") { locked = true; setTimeout(() => { locked = false; play(aiMove(), false); }, 550 + Math.random() * 400); }
  }

  function finish(w) {
    over = true;
    const tag = document.getElementById("finaleTag"), txt = document.getElementById("finaleText");
    if (w.p === "D") {
      score.D++; sfx.draw();
      statusEl.textContent = "Stalemate";
      boardEl.querySelectorAll(".cell").forEach(c => c.classList.add("dim"));
      tag.textContent = "Neither Yields"; txt.innerHTML = "STALEMATE";
      txt.style.color = "#d9c9a0"; txt.style.textShadow = "0 0 40px rgba(245,200,106,0.5)";
      setTimeout(showFinale, 1300);
    } else {
      score[w.p]++;
      const color = w.p === "X" ? "#ff3b5c" : "#29d3ff";
      // slow motion beat
      timeScale = 0.15;
      document.body.classList.replace("playing", "climax");
      statusEl.textContent = "";
      w.line.forEach(i => boardEl.children[i].classList.add("winner"));
      boardEl.querySelectorAll(".cell").forEach((c, i) => !w.line.includes(i) && c.classList.add("dim"));
      setTimeout(() => {
        const pt = i => [ (i % 3) * 100 + 50, Math.floor(i / 3) * 100 + 50 ];
        const [a, b] = [pt(w.line[0]), pt(w.line[2])];
        const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), ex = dx / len * 40, ey = dy / len * 40;
        const ln = document.getElementById("slashLine");
        ln.setAttribute("x1", a[0] - ex); ln.setAttribute("y1", a[1] - ey);
        ln.setAttribute("x2", b[0] + ex); ln.setAttribute("y2", b[1] + ey);
        ln.style.filter = `drop-shadow(0 0 8px ${color}) drop-shadow(0 0 24px ${color})`;
        ln.classList.remove("go"); void ln.offsetWidth; ln.classList.add("go");
        sfx.boom();
        const fl = document.getElementById("flash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
        const st = document.getElementById("stage"); st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
        const r = document.getElementById("boardWrap").getBoundingClientRect();
        timeScale = 1;
        burst((r.left + r.width / 2) * devicePixelRatio, (r.top + r.height / 2) * devicePixelRatio, color, 160);
        burst((r.left + r.width / 2) * devicePixelRatio, (r.top + r.height / 2) * devicePixelRatio, "#f5c86a", 70);
      }, 650);
      const name = mode === "ai" ? (w.p === "X" ? "YOU WIN" : "MACHINE WINS") : `${w.p} WINS`;
      tag.textContent = mode === "ai" && w.p === "O" ? "Defeat" : "Victory";
      txt.textContent = name; txt.style.color = color; txt.style.textShadow = `0 0 40px ${color}, 0 0 90px ${color}`;
      setTimeout(showFinale, 2000);
    }
    updateScores();
  }
  function showFinale() { document.getElementById("finale").classList.add("show"); }
  function updateScores() {
    document.getElementById("scoreX").textContent = score.X;
    document.getElementById("scoreO").textContent = score.O;
    document.getElementById("scoreD").textContent = score.D;
  }

  function newRound() {
    document.getElementById("finale").classList.remove("show");
    document.getElementById("slashLine").classList.remove("go");
    document.body.classList.remove("climax"); document.body.classList.add("playing");
    board = Array(9).fill(null); over = false; locked = false; turn = starter;
    starter = starter === "X" ? "O" : "X"; // alternate who opens
    render(); setTurnUI();
    if (mode === "ai" && turn === "O") { locked = true; setTimeout(() => { locked = false; play(aiMove(), false); }, 900); }
  }
  function startGame(m) {
    mode = m; score.X = score.O = score.D = 0; starter = "X"; updateScores();
    document.getElementById("nameX").textContent = m === "ai" ? "You" : "Player One";
    document.getElementById("nameO").textContent = m === "ai" ? `Machine · ${diff}` : "Player Two";
    sfx.whoosh(); startDrone();
    document.getElementById("intro").classList.add("gone");
    newRound();
  }
  function toMenu() {
    stopDrone();
    document.body.classList.remove("playing", "climax");
    document.getElementById("finale").classList.remove("show");
    document.getElementById("intro").classList.remove("gone");
  }

  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => startGame(b.dataset.mode));
  document.querySelectorAll("[data-diff]").forEach(b => b.onclick = () => {
    diff = b.dataset.diff; document.querySelectorAll("[data-diff]").forEach(x => x.classList.toggle("active", x === b)); tone({ freq: 660, dur: 0.12, vol: 0.06 });
  });
  document.getElementById("restart").onclick = () => { if (!locked) newRound(); };
  document.getElementById("menuBtn").onclick = toMenu;
  document.getElementById("again").onclick = newRound;
  addEventListener("keydown", e => {
    if (e.key >= "1" && e.key <= "9" && document.body.classList.contains("playing")) { const k = +e.key - 1; play([6,7,8,3,4,5,0,1,2][k], true); }
    if (e.key === "Enter" && document.getElementById("finale").classList.contains("show")) newRound();
  });
})();
</script>
</body>
</html>
